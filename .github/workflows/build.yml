name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # lets you start it manually from the Actions tab

jobs:
  windows:
    name: Windows (MSVC + Qt 6 GUI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          arch: win64_msvc2019_64
          cache: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_PREFIX_PATH="$env:QT_ROOT_DIR"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Bundle the app with its Qt DLLs
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build\Release\canlog_gui.exe, build\Release\canlog_cli.exe dist\
          windeployqt --release dist\canlog_gui.exe
          Copy-Item -Recurse data dist\data

      - name: Upload the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: canlog-windows
          path: dist

  linux:
    name: Linux (GCC, ASan + UBSan, no GUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCANLOG_BUILD_GUI=OFF
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=all"

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure
